// Top-level build file for the BS·KILLER loader.
buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        // 8.13.2 is what this project builds with: compileSdk 36 and
        // aidlPackagedList both need a modern AGP.
        classpath 'com.android.tools.build:gradle:8.13.2'
    }
}

// Read by every module's build.gradle.
ext {
    compileSdkVersion = 36
    buildToolsVersion = "36.1.0"
    targetSdkVersion = 28
    minSdk = 24

    // The payload's NDK (pinned again in app/build.gradle). It is the only
    // native build left: the SpaceCore engine (:Spacecore) ships its
    // libfcore.so/libshadowhook.so/libpine.so prebuilt inside the AAR, so
    // there is no engine NDK, no CMake project and no gradle-driven CMake
    // install any more.
    ndkVersion = "27.0.12077973"
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// There is deliberately NO flat-jar packaging task here.
// The engine is consumed as a normal Gradle library module
// (app depends on `project(':Spacecore')`, which resolves the vendored
// com.fvbox:flib:1.0.0 AAR), so Gradle always resolves the exact AAR that is
// committed in Spacecore/repo/ and can never reuse a stale prebuilt jar.
