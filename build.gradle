// Top-level build file for the BS·KILLER loader.
buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        // 8.13.2 is what this project builds with: compileSdk 36 and
        // aidlPackagedList both need a modern AGP.
        classpath 'com.android.tools.build:gradle:8.13.2'
    }
}

// Read by every module's build.gradle.
ext {
    compileSdkVersion = 36
    buildToolsVersion = "36.1.0"
    targetSdkVersion = 28
    minSdk = 24

    // Shared by both native builds: the payload (app/src/main/jni) and the
    // BlackBox core (bcore/src/main/cpp). Both need r26+ for
    // APP_SUPPORT_FLEXIBLE_PAGE_SIZES (16 KB page sizes).
    ndkVersion = "27.0.12077973"
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// There is deliberately NO flat-jar packaging task here.
// The core is built from the vendored bcore/ module (`implementation
// project(':bcore')`), so Gradle always compiles it from source and can never
// reuse a stale prebuilt jar or AAR.
