// Top-level build file for the BS·KILLER loader.
buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        // 8.13.2 is what the vendored engine builds with: compileSdk 36 and
        // aidlPackagedList both need a modern AGP.
        classpath 'com.android.tools.build:gradle:8.13.2'
    }
}

// Read by every module's build.gradle — Bcore and its helpers use rootProject.ext.
ext {
    compileSdkVersion = 36
    buildToolsVersion = "36.1.0"
    targetSdkVersion = 28
    minSdk = 24
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// There is deliberately NO flat-jar ("bcoreJar") packaging task here any more.
// The sandbox core is consumed as a normal Gradle library module
// (app depends on `project(':Bcore')`), so Gradle always compiles the core from
// the sources on disk and can never reuse a stale prebuilt jar. A
// `dist/bcore-all.jar` dropped into app/libs used to be an option; that path is
// removed because a leftover jar there silently shadows source changes.
