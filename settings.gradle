pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        // Kept for JitPack-published libraries (FreeReflection, BlackReflection).
        maven { url 'https://jitpack.io' }
    }
}

include ':app'

rootProject.name = 'BSKillerLoader'
