pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        // Needed by the engine: FreeReflection, toml4j and BlackReflection
        // (core + annotation processor) are all published to JitPack.
        maven { url 'https://jitpack.io' }
    }
}

include ':app'

// The sandbox engine ("KERO" build), built from source.
// One library module holding every package root: top/niunaijun/**, black/**, android/**.
include ':Bcore'

// There is no in-tree BlackReflection any more: this engine takes
// com.github.CodingGay.BlackReflection:core:1.1.4 (runtime) and
// :compiler:1.1.4 (annotation processor) from JitPack, so the former
// ':black-reflection' and ':compiler' modules are gone.

rootProject.name = 'BSKillerLoader'
