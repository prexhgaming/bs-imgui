pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        // Kept for JitPack-published libraries (FreeReflection, BlackReflection).
        maven { url 'https://jitpack.io' }
    }
}

include ':app'

// The BlackBox core, vendored as a single module: upstream's Bcore +
// black-reflection + compiler folded into one folder (see bcore/build.gradle).
include ':bcore'

rootProject.name = 'BSKillerLoader'
