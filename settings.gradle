pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

include ':app'

// The sandbox core, built from source as library modules.
// android-mirror lives under Bcore/ as a submodule, like black-fake and black-hook.
include ':Bcore'
include ':Bcore:black-fake'
include ':Bcore:black-hook'
include ':Bcore:android-mirror'

rootProject.name = 'BSKillerLoader'
