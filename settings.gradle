pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

include ':app'

// The sandbox core, built from source as a single library module.
// It used to be four modules (Bcore + android-mirror, black-fake, black-hook as submodules);
// they were merged into one, so :Bcore is all there is.
include ':Bcore'

rootProject.name = 'BSKillerLoader'
