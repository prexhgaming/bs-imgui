name: Android Build

# Builds and signs the loader APK with Gradle. Gradle drives both native builds
# itself: ndk-build for the payload (app/src/main/jni) and CMake for the :Bcore
# engine (Bcore/src/main/cpp), so the native libs are compiled as part of the
# normal app build.
#
# Only `assembleRelease` is built. AGP force-disables R8 obfuscation AND
# optimisation for any `debuggable` build type, so a release build is the only
# one whose classes are actually renamed; the release build type is also signed
# with OUR certificate, so the APK installs as an update over an existing one.
#
# `:Bcore` is consumed as a plain Gradle library module (no flat jar, no
# bcoreJar task), so every build compiles the engine from the sources on disk.
#
# Reporting:
#   - failure -> the full build log (build.log) to Telegram
#   - success -> the signed APK to Telegram
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'Bcore/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'Bcore/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Payload NDK — must match rootProject.ext.ndkVersion.
  # r26+ is required: Application.mk sets APP_SUPPORT_FLEXIBLE_PAGE_SIZES.
  NDK_VERSION: 27.0.12077973
  # The engine (:Bcore) is pinned to the NDK it was written against
  # (rootProject.ext.engineNdkVersion). Both must be installed.
  ENGINE_NDK_VERSION: 24.0.8215888
  # The engine's native build is CMake; 3.22.1 still accepts its
  # cmake_minimum_required(3.4.1). CMake 3.31+ would reject that.
  CMAKE_VERSION: 3.22.1
  # Must match the AGP 8.13.2 / compileSdk 36 toolchain.
  GRADLE_VERSION: '8.14.5'
  LOG_FILE: build.log

jobs:
  build:
    name: gradle assemble (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle reads signing.properties from the project root and resolves
      # storeFile relative to it, so both files land at the repo root.
      # Secrets are unavailable on fork PRs -> warn and build unsigned.
      - name: Decode signing material
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_PROPS_B64: ${{ secrets.SIGNING_PROPERTIES_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${SIGNING_PROPS_B64:-}" ]; then
            echo "::warning::Signing secrets missing (fork PR?) - APK will use the default debug key"
            exit 0
          fi

          printf '%s' "$SIGNING_PROPS_B64" | base64 -d > signing.properties
          # The keystore filename comes from signing.properties (storeFile=).
          STORE_FILE="$(sed -n 's/^[[:space:]]*storeFile[[:space:]]*=[[:space:]]*//p' signing.properties | tr -d '\r' | head -n1)"
          if [ -z "$STORE_FILE" ]; then
            echo "::error::signing.properties has no storeFile entry"
            exit 1
          fi

          printf '%s' "$KEYSTORE_B64" | base64 -d > "$STORE_FILE"
          chmod 600 "$STORE_FILE" signing.properties

          echo "keystore -> $STORE_FILE ($(wc -c < "$STORE_FILE") bytes)"
          grep -E '^[[:space:]]*(storeFile|keyAlias)' signing.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          # NEVER restore a cached Gradle User Home. A restored home can make
          # Gradle treat :Bcore's tasks as UP-TO-DATE and reuse stale outputs,
          # which silently ships an old engine while every source change looks
          # applied. Correctness beats a ~40 s cache win here.
          cache-disabled: true

      - name: Install Android NDK and SDK
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # The payload is ndk-build, the engine is CMake (needs an explicit
          # cmake install), and both NDKs are pinned per module.
          "$SDKMANAGER" --install \
            "ndk;${NDK_VERSION}" \
            "ndk;${ENGINE_NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}" \
            "platforms;android-36" \
            "build-tools;36.1.0"
          echo "payload NDK at: ${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/${NDK_VERSION}"
          echo "engine  NDK at: ${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/${ENGINE_NDK_VERSION}"
          echo "cmake       at: ${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmake/${CMAKE_VERSION}"

      # `tee` keeps the full output on disk for the Telegram upload while it
      # still streams live to the Actions log. pipefail is what makes the step
      # fail on a compile error instead of on tee's exit code.
      - name: Build with Gradle (tee to log)
        id: build
        run: |
          set -o pipefail
          {
            echo "== gradle $(gradle --version 2>/dev/null | grep -m1 '^Gradle' || echo '?') =="
            echo "== ndk: ${NDK_VERSION} =="
            grep -E '^[[:space:]]*APP_(ABI|PLATFORM|MODULES)' app/src/main/jni/Application.mk || true
            # Fingerprint the engine so a stale build is visible in the log: this
            # hash changes whenever ANY file under Bcore/src changes.
            echo "== engine: $(find Bcore/src -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1 | cut -c1-16) ($(find Bcore/src -type f | wc -l) files) =="
            echo "== started: $(date -u +%FT%TZ) =="
            echo
          } | tee "$LOG_FILE"

          # --no-build-cache: no task output may be reused from a previous build.
          gradle assembleRelease \
            --no-build-cache --no-daemon 2>&1 | tee -a "$LOG_FILE"

      # Fails loudly if the APK came out with the default debug key instead of
      # ours, instead of shipping something that cannot update a real install.
      - name: Verify APK is signed
        id: verify
        if: success()
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n1)"
          if [ -z "$apk" ]; then
            apk="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          fi
          if [ -z "$apk" ]; then
            echo "::error::No release APK produced"
            exit 1
          fi

          # apksigner is authoritative (it parses the signing block, unlike a
          # META-INF grep which only sees the optional v1 signature).
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner -type f | sort | tail -n1)"
          [ -x "$APKSIGNER" ] || { echo "::error::apksigner not found"; exit 1; }

          # Secrets are unavailable on fork PRs, so a release build comes out
          # UNSIGNED there: warn instead of failing, but still check the libs.
          if [ -f signing.properties ]; then
            "$APKSIGNER" verify --verbose --print-certs "$apk"

            # The APK must carry OUR certificate, not the default
            # "CN=Android Debug" one. (A release build can't pick the debug key
            # up from the debug build type, so this now guards against a
            # misconfigured signingConfig instead.)
            CERTS="$("$APKSIGNER" verify --print-certs "$apk")"
            if printf '%s' "$CERTS" | grep -q 'CN=Android Debug'; then
              echo "::error::$apk is signed with the default Android debug key"
              exit 1
            fi
            printf '%s\n' "$CERTS" | grep 'certificate DN'
          else
            echo "::warning::signing.properties missing (fork PR?) - release APK is UNSIGNED"
          fi

          # Both native libs must be inside the APK: the payload and the engine.
          for lib in lib/armeabi-v7a/libzyn-bs.so lib/armeabi-v7a/libblackbox.so; do
            if ! unzip -l "$apk" | grep -q "$lib"; then
              echo "::error::$lib is missing from $apk"
              exit 1
            fi
          done
          echo "native libs: libzyn-bs.so + libblackbox.so (armeabi-v7a)"

          # Ship it under a stable, versioned name rather than app-debug.apk.
          # sed (not grep -P) so this also works with BusyBox grep.
          VERSION="$(sed -n "s/.*versionName[[:space:]]*'\([^']*\)'.*/\1/p" app/build.gradle | head -n1)"
          APK_OUT="dist/bskiller-${VERSION:-0.0.0}-${GITHUB_RUN_NUMBER}.apk"
          mkdir -p dist
          cp "$apk" "$APK_OUT"

          echo "signed APK: $APK_OUT ($(wc -c < "$APK_OUT") bytes)"
          {
            echo "apk=$APK_OUT"
            echo "apk_name=$(basename "$APK_OUT")"
            echo "apk_bytes=$(wc -c < "$APK_OUT")"
          } >> "$GITHUB_OUTPUT"

      - name: Telegram - send build log (failure)
        if: failure()
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -uo pipefail
          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${CHAT_ID:-}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID missing - skipping notification"
            exit 0
          fi
          if [ ! -s "$LOG_FILE" ]; then
            echo "::warning::No $LOG_FILE was produced - nothing to send"
            exit 0
          fi

          curl -sS --fail-with-body \
            -F "chat_id=${CHAT_ID}" \
            -F "document=@${LOG_FILE};filename=build-${GITHUB_RUN_NUMBER}-failed.log" \
            -F "caption=❌ Build FAILED - ${GITHUB_REPOSITORY}
          ref: ${GITHUB_REF_NAME}  |  run: #${GITHUB_RUN_NUMBER}
          commit: ${GITHUB_SHA:0:7}
          ndk: ${NDK_VERSION}" \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
          echo

      - name: Telegram - send APK (success)
        if: success()
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -uo pipefail
          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${CHAT_ID:-}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID missing - skipping notification"
            exit 0
          fi

          APK="${{ steps.verify.outputs.apk }}"

          if [ -s "$APK" ]; then
            curl -sS --fail-with-body \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@${APK};filename=${{ steps.verify.outputs.apk_name }}" \
              -F "caption=✅ Build OK - ${GITHUB_REPOSITORY}
          ref: ${GITHUB_REF_NAME}  |  run: #${GITHUB_RUN_NUMBER}
          commit: ${GITHUB_SHA:0:7}
          apk: ${{ steps.verify.outputs.apk_name }} (${{ steps.verify.outputs.apk_bytes }} bytes)" \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
            echo
          else
            echo "::warning::$APK missing - not sending the APK"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loader-${{ github.run_number }}
          path: |
            ${{ env.LOG_FILE }}
            dist/*.apk
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14
