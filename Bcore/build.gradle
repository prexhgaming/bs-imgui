plugins {
    id 'com.android.library'
}

// The whole sandbox core, in one module. It used to be four (:Bcore, :Bcore:android-mirror,
// :Bcore:black-fake, :Bcore:black-hook) that were merged because:
//   - every class already lived in its final package, so merging changed no source and no import;
//   - the split forced the cross-module AIDL re-export hack (aidlPackageWhiteList) for a single
//     import, which a shared aidl source set resolves on its own;
//   - the "compiler" is an external Maven artifact, not a project module, so it never needed a
//     module of its own.
// Packages now living here:
//   com.hello.sandbox.**        the engine (was :Bcore, plus black-fake's FakeCore)
//   black.**                    BlackReflection mirrors; the annotation processor below generates
//                               the BR* helpers from these @BClassName-annotated sources
//   android.**                  black-fake's platform stubs (deliberately shadowing android.jar)
//   top.niunaijun.jnihook.**    the JNI-reflection hook (was :Bcore:black-hook)
android {

    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    namespace "com.hello.sandbox"

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        // Ship the keep rules to any app that depends on this module.
        consumerProguardFiles "consumer-rules.pro"

        // The game target is 32-bit, but the engine is built for every ABI so the
        // same jar/sources can be reused by a 64-bit host later. The app module
        // decides what actually gets packaged into an APK.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path file('./src/main/cpp/CMakeLists.txt')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        aidl true
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    ndkVersion '27.0.12077973'
}

tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addStringOption('encoding', 'UTF-8')
    options.addStringOption('charSet', 'UTF-8')
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // black-hook used to pull material in; the merged module needs it directly.
    implementation 'com.google.android.material:material:1.9.0'

    implementation 'com.github.tiann:FreeReflection:3.1.0'
    implementation "com.github.CodingGay.BlackReflection:core:$rootProject.ext.blackReflection"
    // Generates the BR* mirror classes from the @BClassName-annotated black.** sources above.
    // Applied in :Bcore:android-mirror before the merge; runs over this whole module now.
    annotationProcessor "com.github.CodingGay.BlackReflection:compiler:$rootProject.ext.blackReflection"

    implementation 'top.canyie.pine:core:0.2.9'
    implementation 'top.canyie.pine:xposed:0.1.0'
}
