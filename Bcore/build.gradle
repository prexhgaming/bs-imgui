apply plugin: 'com.android.library'

// ---------------------------------------------------------------------------
// The sandbox engine ("KERO" build, BCORE-KERO-FixedSDK).
//
// Differences from the previously vendored engines worth knowing:
//   - native side is a **CMake** project (src/main/cpp/CMakeLists.txt), not
//     ndk-build, and it links no prebuilt third-party .a
//   - BlackReflection comes from JitPack
//     (com.github.CodingGay.BlackReflection core + compiler), so the in-tree
//     `black-reflection/` and `compiler/` Gradle modules are gone
//   - package layout is unchanged: top.niunaijun.blackbox (public API
//     BlackBoxCore), top.niunaijun.jnihook, black/** mirrors, android/** stubs
// ---------------------------------------------------------------------------

android {
    namespace 'top.niunaijun.blackbox'

    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    // The engine is pinned to the NDK it was written against; the payload in
    // :app keeps its own (newer) NDK. CI installs both.
    ndkVersion rootProject.ext.engineNdkVersion
    aidlPackagedList "android/app/IServiceConnection.aidl"
    aidlPackagedList "android/accounts/IAccountManagerResponse.aidl"

    buildFeatures {
        aidl true
    }

    defaultConfig {
        // Matches :app (the final APK uses the app's value anyway).
        minSdkVersion rootProject.ext.minSdk
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        consumerProguardFiles "consumer-rules.pro"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('./src/main/cpp/CMakeLists.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    aaptOptions {
        cruncherEnabled = false
        useNewCruncher = false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    // Only the two settings :app also uses. The engine's original
    // `lintOptions` block set textOutput/textReport/check with method-call
    // syntax; in AGP 8 those are Property<String>/Property<Boolean>, so that
    // syntax fails at configuration time ("Value is null"). Lint is not run by
    // assembleRelease, so nothing is lost by dropping them.
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

// NOTE: the engine's own build.gradle carried a legacy `dexOptions { ... }`
// block. That DSL was removed from AGP 8.x and it only ever tuned the old
// pre-D8 dexer, so it is deliberately not carried over.

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.moandjiezana.toml:toml4j:0.7.2'
    implementation 'com.github.tiann:FreeReflection:3.2.2'
    // BlackReflection runtime + annotation processor (replaces the in-tree
    // :black-reflection and :compiler modules).
    implementation 'com.github.CodingGay.BlackReflection:core:1.1.4'
    annotationProcessor 'com.github.CodingGay.BlackReflection:compiler:1.1.4'
}
