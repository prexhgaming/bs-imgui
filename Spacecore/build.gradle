// ---------------------------------------------------------------------------
// SpaceCore sandbox engine — https://github.com/FSpaceCore/SpaceCore
//
// Unlike the previous engine (:Bcore) this one is NOT built from source: the
// upstream repository ships its sandbox as a prebuilt AAR
// (`app/libs/flib-release.aar`, package `com.fvbox.lib`, public entry point
// `com.fvbox.lib.FCore`). There is no engine source to compile and no CMake or
// ndk-build step — `libfcore.so`, `libshadowhook.so`, `libpine.so` and the
// xcrash libs are already inside the AAR for arm64-v8a, armeabi-v7a, x86 and
// x86_64.
//
// The AAR is vendored into an in-repo Maven repository
// (Spacecore/repo/com/fvbox/flib/1.0.0/) and declared as a normal coordinate
// below. That is deliberate: a plain `files('libs/foo.aar')` dependency is not
// fully supported for library modules, while a Maven-resolved AAR gets the full
// AGP treatment — manifest merging (the engine contributes ~2500 proxy
// activities and its permissions), resource merging, jni libs and its
// consumer ProGuard rules.
// ---------------------------------------------------------------------------

plugins {
    id 'com.android.library'
}

android {
    // NOT `com.fvbox.lib`. AGP generates an R class for the AAR from its R.txt
    // under the AAR's own package, so a module namespace of `com.fvbox.lib`
    // would emit a second `com.fvbox.lib.R` and fail with a duplicate class.
    // This module has no resources of its own, so its namespace only has to be
    // unique.
    namespace 'com.zyn.spacecore'

    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        // The AAR itself declares minSdk 23; the app raises it.
        minSdkVersion rootProject.ext.minSdk
        targetSdkVersion rootProject.ext.targetSdkVersion

        // No abiFilters here: the AAR ships all four ABIs and the app's own
        // abiFilters (armeabi-v7a, see app/build.gradle) decides what ends up
        // in the APK.
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // The engine. Resolved from the in-repo Maven repo declared in
    // settings.gradle. `api` because :app calls com.fvbox.lib.FCore directly.
    api 'com.fvbox:flib:1.0.0'

    // Runtime dependencies the AAR does NOT bundle. It shades
    // top.niunaijun.blackreflection, org.lsposed.hiddenapibypass,
    // top.canyie.pine, com.bytedance.shadowhook and xcrash into classes.jar,
    // but Kotlin, coroutines and MMKV are real external dependencies — the
    // upstream demo app declares exactly these versions.
    api 'org.jetbrains.kotlin:kotlin-stdlib:1.6.10'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.5.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.5.2'
    implementation 'com.tencent:mmkv-static:1.2.10'
}
