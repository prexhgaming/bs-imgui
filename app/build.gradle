plugins {
    id 'com.android.application'
}

// ---------------------------------------------------------------------------
// Release signing
// ---------------------------------------------------------------------------
// Credentials are NEVER committed. CI materialises both files into the project
// root from repository secrets (see .github/workflows/android-build.yml):
//   signing.properties  -> storeFile / storePassword / keyAlias / keyPassword
//   <storeFile>         -> the keystore itself
// When they are absent (forks, local debug builds) the release APK is simply
// left unsigned instead of failing the build.
def signingPropsFile = rootProject.file('signing.properties')
def signingProps = new Properties()
def hasSigning = signingPropsFile.exists()
if (hasSigning) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}

android {
    namespace 'com.zyn.bs'
    // 36 to match :Spacecore and the 36.1.0 build tools. The engine AAR itself
    // declares no minCompileSdk, so this is a toolchain choice, not an AAR
    // requirement.
    compileSdk 36
    buildToolsVersion '36.1.0'
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        applicationId 'com.zyn.bs'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '4.0.1'

        // The SpaceCore AAR's own manifest sets android:debuggable="true".
        // Pinning the attribute here (per build type, via the ${debuggable}
        // placeholder) keeps release builds non-debuggable instead of inheriting
        // the library value.
        manifestPlaceholders = [debuggable: 'false']

        // Must match jni/Application.mk (APP_ABI := armeabi-v7a).
        ndk {
            abiFilters 'armeabi-v7a'
        }

        // The target game lives in GameConfig.java, not here.
    }

    // The SpaceCore AAR's manifest sets android:extractNativeLibs="true", and
    // AGP does NOT merge that attribute from libraries — it is driven by this
    // DSL instead. Matching it keeps the engine's .so files extracted to
    // /data/app/<pkg>/lib/arm/ exactly as in upstream's own (working) build, so
    // any dlopen-by-absolute-path inside libfcore.so keeps working.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    // Gradle drives ndk-build itself: `gradle assembleDebug` compiles
    // jni/Android.mk into libzyn-bs.so and packages it into the APK.
    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    signingConfigs {
        release {
            if (hasSigning) {
                storeFile rootProject.file(signingProps.getProperty('storeFile'))
                storePassword signingProps.getProperty('storePassword')
                keyAlias signingProps.getProperty('keyAlias')
                keyPassword signingProps.getProperty('keyPassword')
            }
            // Broad APK signature scheme coverage: v2/v3 are required for
            // targetSdk 30+, v1 keeps very old installers happy.
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        debug {
            debuggable true
            manifestPlaceholders = [debuggable: 'true']
            // R8 is ON for debug as well, because debug is the build type CI
            // ships and signs. The engine keeps ITSELF through the consumer
            // ProGuard rules inside the SpaceCore AAR (AGP merges them in); our
            // own code is deliberately shrunk and renamed (see
            // proguard-rules.pro).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign debug builds with OUR key, not the default debug keystore.
            // Same signature as release means a debug build installs as an
            // update over an existing install instead of conflicting with it.
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
        release {
            debuggable false
            manifestPlaceholders = [debuggable: 'false']
            // Shrink + rename our own code. The engine is kept by the AAR's
            // consumer rules plus proguard-rules.pro; manifest-declared
            // components are kept automatically by AGP.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        // The core only behaves on targetSdk 28 (its reflected platform APIs are
        // the pre-29 ones), so "Google Play requires targetSdk 31+" is expected
        // here and must not fail the build. This is a sideloaded app, not a
        // Play Store submission.
        disable 'ExpiredTargetSdkVersion'
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        // 21 to match :Spacecore (JDK 21 in CI). The engine AAR itself is
        // compiled for Java 8, which is fine — Java 21 can consume it.
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/ASL2.0'
    }

    aaptOptions {
        cruncherEnabled = false
        useNewCruncher = false
    }
}

dependencies {
    // The sandbox engine, consumed as a normal Gradle library module
    // (:Spacecore). That module resolves the vendored
    // com.fvbox:flib:1.0.0 AAR from Spacecore/repo and re-exports it, so
    // com.fvbox.lib.FCore and friends are on this module's compile classpath.
    implementation project(':Spacecore')

    // NOT optional: the engine's rule store (com.fvbox.lib's obfuscated `u1`)
    // does `new Gson()` in a static initialiser to (de)serialise PackageRule
    // JSON, but the AAR shades every other dependency and leaves Gson
    // unresolved. Upstream's demo only got it transitively via
    // retrofit-converter-gson. Without it, addRule()/init() die with
    // NoClassDefFoundError. R8 confirms the gap:
    // "Missing class com.google.gson.Gson (referenced from ...)".
    implementation 'com.google.code.gson:gson:2.10.1'

    // The engine's own runtime dependencies (the AAR bundles its native libs
    // and the hooking/reflection libraries, but not these). Versions mirror the
    // upstream SpaceCore demo app so the engine runs against what it was
    // written for. They are also declared in :Spacecore — repeated here so the
    // engine's runtime is explicit at the app level.
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.6.10'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.5.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.5.2'
    implementation 'com.tencent:mmkv-static:1.2.10'

    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
