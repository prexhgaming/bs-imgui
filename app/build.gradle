plugins {
    id 'com.android.application'
}

// ---------------------------------------------------------------------------
// Release signing
// ---------------------------------------------------------------------------
// Credentials are NEVER committed. CI materialises both files into the project
// root from repository secrets (see .github/workflows/android-build.yml):
//   signing.properties  -> storeFile / storePassword / keyAlias / keyPassword
//   <storeFile>         -> the keystore itself
// When they are absent (forks, local debug builds) the release APK is simply
// left unsigned instead of failing the build.
def signingPropsFile = rootProject.file('signing.properties')
def signingProps = new Properties()
def hasSigning = signingPropsFile.exists()
if (hasSigning) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}

android {
    namespace 'com.zyn.bs'
    // 36 to match the 36.1.0 build tools. The bcore module declares no
    // minCompileSdk, so this is a toolchain choice, not a library requirement.
    compileSdk 36
    buildToolsVersion '36.1.0'
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        applicationId 'com.zyn.bs'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '4.0.1'

        // A library manifest may hardcode android:debuggable="true". Pinning
        // the attribute here (per build type, via the ${debuggable}
        // placeholder) keeps release builds non-debuggable instead of
        // inheriting it.
        manifestPlaceholders = [debuggable: 'false']

        // The app narrows the ABI set: the core library builds both ABIs, but
        // only the 32-bit one is useful here. Must match jni/Application.mk
        // (APP_ABI := armeabi-v7a) and the target game's 32-bit payload.
        ndk {
            abiFilters 'armeabi-v7a'
        }

        // The single target game lives in LauncherActivity.TARGET_PACKAGE,
        // not here.
    }

    // The core expects android:extractNativeLibs="true", and AGP does NOT
    // merge that attribute from libraries — it is driven by this DSL instead.
    // Keeping it true extracts the .so files to /data/app/<pkg>/lib/arm/
    // exactly as in upstream's own (working) build, so any
    // dlopen-by-absolute-path inside the core keeps working.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    // Gradle drives ndk-build itself: `gradle assembleDebug` compiles
    // jni/Android.mk into libzyn-bs.so and packages it into the APK.
    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    signingConfigs {
        release {
            if (hasSigning) {
                storeFile rootProject.file(signingProps.getProperty('storeFile'))
                storePassword signingProps.getProperty('storePassword')
                keyAlias signingProps.getProperty('keyAlias')
                keyPassword signingProps.getProperty('keyPassword')
            }
            // Broad APK signature scheme coverage: v2/v3 are required for
            // targetSdk 30+, v1 keeps very old installers happy.
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        debug {
            debuggable true
            manifestPlaceholders = [debuggable: 'true']
            // R8 is ON for debug as well, because debug is the build type CI
            // ships and signs. The engine is kept by the -keep rules in
            // proguard-rules.pro; our own code is deliberately shrunk and
            // renamed.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign debug builds with OUR key, not the default debug keystore.
            // Same signature as release means a debug build installs as an
            // update over an existing install instead of conflicting with it.
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
        release {
            debuggable false
            manifestPlaceholders = [debuggable: 'false']
            // Shrink + rename our own code. The engine is kept by the AAR's
            // consumer rules plus proguard-rules.pro; manifest-declared
            // components are kept automatically by AGP.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        // The core only behaves on targetSdk 28 (its reflected platform APIs are
        // the pre-29 ones), so "Google Play requires targetSdk 31+" is expected
        // here and must not fail the build. This is a sideloaded app, not a
        // Play Store submission.
        disable 'ExpiredTargetSdkVersion'
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        // 21 (JDK 21 in CI). The bcore module is compiled for Java 21 as well.
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/ASL2.0'
    }

    aaptOptions {
        cruncherEnabled = false
        useNewCruncher = false
    }
}

dependencies {
    // The BlackBox core, built from the vendored bcore/ module.
    implementation project(':bcore')
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'net.lingala.zip4j:zip4j:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okio:okio:3.9.0'
    implementation 'com.github.tiann:FreeReflection:3.2.2'
}
