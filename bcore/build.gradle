// BlackBox core (NewBlackbox by ALEX5402), vendored as ONE module.
//
// Upstream splits this over three Gradle modules: Bcore (Android library),
// black-reflection (plain java-library) and compiler (annotation processor).
// Here they live together:
//
//   * black-reflection sources are merged into src/main/java (same
//     top.niunaijun.blackreflection package, no collisions) because they are
//     plain Java with no Android dependencies.
//   * compiler CANNOT be merged into this module: an annotation processor runs
//     on the host JVM at compile time, so it must be a separate artifact. It is
//     prebuilt and committed as libs/blackreflection-compiler.jar instead.
//
// That keeps the whole core in one folder with no extra Gradle modules.

apply plugin: 'com.android.library'

android {
    namespace 'top.niunaijun.blackbox'

    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    aidlPackagedList "android/app/IServiceConnection.aidl"
    aidlPackagedList "android/accounts/IAccountManagerResponse.aidl"

    buildFeatures {
        aidl true
    }

    defaultConfig {
        minSdkVersion rootProject.ext.minSdk

        consumerProguardFiles "consumer-rules.pro"

        ndk {
            // Every ABI this core supports — both of them. This is NOT the
            // app's narrowing; app/build.gradle picks armeabi-v7a out of here.
            //
            // It has to be declared because AGP drives ndk-build with an
            // explicit `APP_ABI=<abi>` on the command line for each ABI it
            // thinks the module supports, and that overrides APP_ABI in
            // Application.mk. With no abiFilters, AGP asks for the NDK's whole
            // default set (x86, x86_64, ...) and the build dies at configure
            // time on Dobby/x86/libdobby.a, which does not exist.
            //
            // The list is exactly APP_ABI in src/main/cpp/Application.mk, and
            // Dobby only ships prebuilts for these two:
            //   Dobby/armeabi-v7a/libdobby.a
            //   Dobby/arm64-v8a/libdobby.a
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/cpp/Android.mk'
        }
    }

    // Pinned explicitly so the core and the payload always build with the same
    // NDK. Both need r26+ for APP_SUPPORT_FLEXIBLE_PAGE_SIZES (16 KB pages).
    ndkVersion rootProject.ext.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:-deprecation" << "-Xlint:-unchecked" << "-Xlint:-rawtypes"
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    // AGP 8 DSL (upstream's deprecated `packagingOptions`/`lintOptions` names).
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    // Only properties that still exist in AGP 8: upstream's `textOutput` and
    // `textReport` were removed/renamed and made the whole module fail to
    // evaluate ("Value is null"). Lint is not part of assembleDebug anyway, so
    // this stays to the three long-standing booleans.
    lint {
        checkReleaseBuilds = false
        abortOnError = false
        warningsAsErrors = false
    }
}

dependencies {
    // libs/ holds only the prebuilt annotation processor, which must stay OFF
    // the compile/runtime classpath — it runs on the host JVM at compile time.
    // javapoet is its only dependency, so it goes on the processor path too.
    annotationProcessor files("libs/blackreflection-compiler.jar")
    annotationProcessor "com.squareup:javapoet:1.13.0"

    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.moandjiezana.toml:toml4j:0.7.2'
    implementation 'com.github.tiann:FreeReflection:3.2.2'
}
